[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vq2"
version = "0.2.0"
description = "Extreme Vector Quantization (VQ2) & Paged MoE Streaming Engine (LEGION) for Large Language Models"
readme = "README.md"
authors = [
  { name = "VQ2 Research Team" }
]
license = { text = "MIT" }
keywords = [
  "vector-quantization",
  "llm-compression",
  "moe",
  "triton",
  "paged-streaming",
  "cuda-graphs",
  "qwen",
  "ans-coding"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1.0",
  "transformers>=4.40.0",
  "accelerate>=0.28.0",
  "safetensors>=0.4.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "constriction>=0.4.0",
  "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "isort",
  "rich",
  "huggingface_hub"
]

[project.scripts]
vq2 = "vq2.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vq2*", "legion*", "web_app*", "tools*"]
